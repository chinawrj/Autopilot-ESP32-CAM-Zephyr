# Autopilot ESP32-CAM Zephyr — Project Configuration

# Core
CONFIG_GPIO=y
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_PRINTK=y
CONFIG_MAIN_STACK_SIZE=8192

# PSRAM (8MB on ESP32-WROVER-E-N8R8)
CONFIG_ESP_SPIRAM=y
CONFIG_ESP_SPIRAM_HEAP_SIZE=3145728

# Heap (WiFi needs ~110KB; reduced from 128KB for DRAM headroom)
CONFIG_HEAP_MEM_POOL_SIZE=114688

# WiFi
CONFIG_WIFI=y
CONFIG_WIFI_ESP32=y
CONFIG_ESP32_WIFI_STA_AUTO_DHCPV4=y
CONFIG_ESP32_WIFI_STA_RECONNECT=y
CONFIG_ESP32_WIFI_NET_ALLOC_SPIRAM=y

# Networking
CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_DHCPV4=y
CONFIG_NET_LOG=y

# TCP / Sockets
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_MAX_CONN=8
CONFIG_NET_MAX_CONTEXTS=10
CONFIG_NET_TCP_TIME_WAIT_DELAY=0
CONFIG_NET_TCP_RETRY_COUNT=2
CONFIG_ZVFS_OPEN_MAX=16

# Network buffers
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_BUF_RX_COUNT=32
CONFIG_NET_BUF_TX_COUNT=32
CONFIG_NET_BUF_DATA_SIZE=256

# ARP table — default 2 is too small for a busy LAN (20+ devices here)
CONFIG_NET_ARP_TABLE_SIZE=8

# Network management events
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y
CONFIG_NET_MGMT_EVENT_QUEUE_SIZE=10
CONFIG_NET_MGMT_EVENT_STACK_SIZE=2048

# WiFi credentials — injected at build time via overlay conf
# Do NOT put real passwords here!
CONFIG_APP_WIFI_SSID=""
CONFIG_APP_WIFI_PASSWORD=""

# I2C (OV2640 SCCB)
CONFIG_I2C=y

# PWM (LEDC for OV2640 XCLK)
CONFIG_PWM=y

# WebSocket handshake support
# WebSocket support
CONFIG_BASE64=y

# Watchdog timer
CONFIG_WATCHDOG=y

# System heap runtime stats (for /api/status memory reporting)
CONFIG_SYS_HEAP_RUNTIME_STATS=y
